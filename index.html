<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arbitrage</title>
  <link rel="stylesheet" href="/styles.css">
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      background-color: #151515;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .shooting-star {
      position: absolute;
      width: 200px;
      height: 2px;
      background: linear-gradient(-90deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0));
      opacity: 0;
      animation: shoot linear forwards;
      animation-iteration-count: infinite;
    }

    @keyframes shoot {
      0% {
        transform: translate(0, 0) rotate(35deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translate(95vw, 100vh) rotate(35deg);
        opacity: 0;
      }
    }
    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(-100px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .container {
      z-index: 1;
      background: #eee;
      border-radius: 12px;
      border: 2px solid #fff;
      border-top: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
      padding: 2rem;
      min-height: 600px;
      animation: fadeInCard 1s ease-in-out;
      transition: transform 0.5s ease, box-shadow 1s ease;
    }

    .container:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 32px rgba(255, 255, 255, 0.20);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #2c3e50;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .input-group label {
      flex: 1;
      font-size: 1rem;
      text-align: left;
    }

    .input-group input {
      flex: 0 0 100px;
      padding: 0.5rem;
      font-size: 1rem;
      border: 2px solid #ced4da;
      border-radius: 6px;
      text-align: center;
      background-clip: padding-box;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.2s;
    }

    .input-group input:hover {
      transform: scale(1.02);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .input-group input:focus {
      outline: none;
      border-color: #5dade2;
      box-shadow: 0 12px 32px rgba(93, 173, 226, 0.4);
      transform: scale(1.02);
    }

    .stake {
      margin-left: 0.75rem;
      font-weight: bold;
      color: #16c60c;
      min-width: 60px;
      text-align: right;
      transition: color 0.3s;
    }

    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    #result {
      margin: 1rem 0;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    #result.valid {
      color: #16c60c;
    }

    #result.invalid {
      color: #f03a17;
    }

    .toggle-btn {
      display: inline-block;
      margin: 0.5rem 0 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .toggle-btn:hover {
      background: #2980b9;
      transform: scale(1.02);
    }

    #betCalc {
      display: none;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.4s ease;
    }

    #betCalc p {
      margin: 0.5rem 0;
      font-size: 1rem;
    }

    #betCalc p strong {
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="sky"></div>

  <div class="container">
    <h1>Arbitrage Calculator</h1>

    <div class="input-group">
      <label>Odds 1:
        <input type="text" id="odds1" autocomplete="off">
      </label>
      <span id="stake1" class="stake"></span>
    </div>

    <div class="input-group">
      <label>Odds 2:
        <input type="text" id="odds2" autocomplete="off">
      </label>
      <span id="stake2" class="stake"></span>
    </div>

    <div id="result"></div>

    <div id="betSection" style="display: none;">
      <button class="toggle-btn" id="modeToggle">Switch to Desired Total Bet</button>

      <div class="input-group" id="desiredProfitSection">
        <label>Desired Profit (€):
          <input type="number" id="desiredProfit" autocomplete="off" step="0.01" min="0.01">
        </label>
      </div>

      <div class="input-group" id="totalBetSection" style="display: none;">
        <label>Total Bet (€):
          <input type="number" id="totalBet" autocomplete="off" step="0.01" min="0.01">
        </label>
      </div>

      <div id="betCalc"></div>
    </div>
  </div>

  <script>
    const sky = document.querySelector('.sky');
    const starCount = 2;
    for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.classList.add('shooting-star');

        const top = Math.random() * 20;
        const left = Math.random() * 10;
        const delay = Math.random() * 30;
        const duration = 3 + Math.random() * 4;

        star.style.top = `${top}%`;
        star.style.left = `${left}%`;
        star.style.animationDelay = `${delay}s`;
        star.style.animationDuration = `${duration}s`;

        star.addEventListener('animationend', () => {
            star.remove();
            createShootingStar();
        });

        sky.appendChild(star);
    }
    function createShootingStar() {
        const star = document.createElement('div');
        star.classList.add('shooting-star');

        const top = Math.random() * 20;
        const left = Math.random() * 10;
        const delay = Math.random() * 30;
        const duration = 3 + Math.random() * 4;

        star.style.top = `${top}%`;
        star.style.left = `${left}%`;
        star.style.animationDelay = `${delay}s`;
        star.style.animationDuration = `${duration}s`;

        star.addEventListener('animationend', () => {
            star.remove();
            createShootingStar();
        });

        sky.appendChild(star);
    }

    const odds1               = document.getElementById('odds1'),
          odds2               = document.getElementById('odds2'),
          stake1              = document.getElementById('stake1'),
          stake2              = document.getElementById('stake2'),
          result              = document.getElementById('result'),
          betSection          = document.getElementById('betSection'),
          desiredProfit       = document.getElementById('desiredProfit'),
          totalBetInput       = document.getElementById('totalBet'),
          betCalc             = document.getElementById('betCalc'),
          modeToggle          = document.getElementById('modeToggle'),
          desiredProfitSection= document.getElementById('desiredProfitSection'),
          totalBetSection     = document.getElementById('totalBetSection');

    let isProfitMode = true;

    function parseOdds(val) {
      val = val.trim().replace(',', '.');
      if (val.endsWith('.')) val += '0';
      const n = parseFloat(val);
      return isNaN(n) ? 0 : n;
    }

    function resetUI() {
      betSection.style.display = 'none';
      stake1.textContent = stake2.textContent = '';
      betCalc.innerHTML = '';
      result.textContent = '';
    }

    function checkArbitrage() {
      const o1 = parseOdds(odds1.value),
            o2 = parseOdds(odds2.value);

      if (o1 < 0 || o2 < 0) {
        result.textContent = '';
        result.className = '';
        return resetUI();
      }

      const sum    = 1/o1 + 1/o2,
            margin = (1 - sum) * 100,
            container = document.querySelector('.container');

      if (sum < 1) {
        container.style.boxShadow = '0 0px 200px rgba(22, 198, 12, 0.5)';
        container.style.border = '2px solid rgba(22, 198, 12, 0.5)';
        container.style.borderTop = 'none';
        result.textContent = `✅ Arbitrage! Margin: ${margin.toFixed(2)}%`;
        result.className = 'valid';
        betSection.style.display = 'block';
        isProfitMode ? calculateFromProfit() : calculateFromTotalBet();
      } else {
        container.style.boxShadow = '0 12px 30px rgba(240, 58, 23, 0.5)';
        container.style.border = '2px solid rgba(240, 58, 23, 0.5)';
        container.style.borderTop = 'none';
        resetUI();
        result.textContent = `❌ No arbitrage available. ${margin.toFixed(2)}%`;
        result.className = 'invalid';
      }

      if (!odd1 || !odd2) {
        resetUI();
        return;
      }
    }

    function calculateFromProfit() {
      const prof = parseOdds(desiredProfit.value);
      if (!prof || isNaN(prof)) {
        betCalc.innerHTML = '';
        betCalc.style.display = 'none';
        return;
      }

      const o1 = parseOdds(odds1.value),
            o2 = parseOdds(odds2.value);

      const num = prof * o2,
            den = o1*o2 - o1 - o2;
      if (den <= 0) {
        betCalc.innerHTML = '<p style="color:red;">Invalid odds for profit calculation.</p>';
        return;
      }

      const x      = num / den,
            y      = (x * o1) / o2,
            total  = x + y,
            payout = x * o1;

      stake1.textContent = x.toFixed(2);
      stake2.textContent = y.toFixed(2);

      betCalc.innerHTML = `
        <p><strong>Bet 1:</strong> €${x.toFixed(2)}</p>
        <p><strong>Bet 2:</strong> €${y.toFixed(2)}</p>
        <p><strong>Total Bet:</strong> €${total.toFixed(2)}</p>
        <p><strong>Total Payout:</strong> €${payout.toFixed(2)}</p>
        <p><strong>Guaranteed Profit:</strong> €${prof.toFixed(2)}</p>
      `;
      betCalc.style.display = 'block';
    }

    function calculateFromTotalBet() {
      const stakeTotal = parseOdds(totalBetInput.value);
      if (!stakeTotal || isNaN(stakeTotal)) {
        betCalc.innerHTML = '';
        betCalc.style.display = 'none';
        return;
      }

      const o1    = parseOdds(odds1.value),
            o2    = parseOdds(odds2.value),
            inv1  = 1/o1,
            inv2  = 1/o2,
            sum   = inv1 + inv2;

      const x      = (inv1/sum) * stakeTotal,
            y      = (inv2/sum) * stakeTotal,
            p1     = x * o1,
            p2     = y * o2,
            pr1    = (p1 - stakeTotal).toFixed(2),
            pr2    = (p2 - stakeTotal).toFixed(2),
            minP   = Math.min(p1, p2).toFixed(2),
            minPr  = Math.min(pr1, pr2);

      stake1.textContent = x.toFixed(2);
      stake2.textContent = y.toFixed(2);

      betCalc.innerHTML = `
        <p><strong>Bet 1:</strong> €${x.toFixed(2)}</p>
        <p><strong>Bet 2:</strong> €${y.toFixed(2)}</p>
        <p><strong>Total Bet:</strong> €${stakeTotal.toFixed(2)}</p>
        <p><strong>Total Payout:</strong> €${minP}</p>
        <p><strong>Guaranteed Profit:</strong> €${minPr}</p>
      `;
      betCalc.style.display = 'block';
    }

    [odds1, odds2, desiredProfit, totalBetInput].forEach(el =>
      el.addEventListener('input', checkArbitrage)
    );
    modeToggle.addEventListener('click', () => {
      isProfitMode = !isProfitMode;
      modeToggle.textContent = isProfitMode
        ? 'Switch to Desired Total Bet'
        : 'Switch to Desired Profit';
      desiredProfitSection.style.display = isProfitMode ? 'flex' : 'none';
      totalBetSection.style.display      = isProfitMode ? 'none' : 'flex';
      checkArbitrage();
    });

    resetUI();
  </script>
</body>
</html>
